name: Build Custom RustDesk Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV
        
    - name: Install dependencies via VCPKG
      run: |
        .\vcpkg\vcpkg install opus:x64-windows-static-md
        .\vcpkg\vcpkg install libvpx:x64-windows-static-md
        .\vcpkg\vcpkg integrate install
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
        
    - name: Build RustDesk
      run: |
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
