name: Build Custom RustDesk Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
        
    - name: Install NASM
      run: |
        choco install nasm -y
        
    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        
    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg install libvpx:x64-windows-static
        C:\vcpkg\vcpkg install libyuv:x64-windows-static
        C:\vcpkg\vcpkg install opus:x64-windows-static
        C:\vcpkg\vcpkg install aom:x64-windows-static
        
    - name: Build RustDesk
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
