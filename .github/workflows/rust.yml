name: Build Custom RustDesk Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
          
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Setup vcpkg with caching
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: 'f7423ee180c4b7f40d43402c2feb3859161ef625'
        
    - name: Install vcpkg dependencies
      run: |
        $ErrorActionPreference = "Stop"
        C:\vcpkg\vcpkg.exe install --triplet x64-windows-static libvpx libyuv opus aom
        
    - name: Install LLVM and Clang
      run: |
        choco install llvm -y
        
    - name: Build
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        python3 res/inline-sciter.py
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
