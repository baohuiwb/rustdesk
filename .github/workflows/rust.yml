name: Build Custom RustDesk Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
        
    - name: Install NASM
      run: |
        choco install nasm -y
        
    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
        
    - name: Cache VCPKG packages
      uses: actions/cache@v3
      with:
        path: C:\vcpkg\installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
        
    - name: Install VCPKG dependencies
      run: |
        C:\vcpkg\vcpkg install opus:x64-windows-static
        C:\vcpkg\vcpkg install libvpx:x64-windows-static
        C:\vcpkg\vcpkg install libyuv:x64-windows-static
        C:\vcpkg\vcpkg install aom:x64-windows-static
        C:\vcpkg\vcpkg integrate install
      env:
        VCPKG_DEFAULT_TRIPLET: x64-windows-static
        
    - name: Build RustDesk
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        cargo build --release --target x86_64-pc-windows-msvc --features inline
      env:
        VCPKG_DEFAULT_TRIPLET: x64-windows-static
        LIBCLANG_PATH: C:\Program Files\LLVM\bin
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
