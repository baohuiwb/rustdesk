name: Build RustDesk Custom

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
        
    - name: Install NASM
      run: |
        choco install nasm -y
        
    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        
    - name: Modify vcpkg.json to remove opus
      run: |
        # 读取并修改 vcpkg.json，移除 opus 依赖
        if (Test-Path "vcpkg.json") {
          $vcpkgJson = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
          
          # 移除 opus 依赖
          if ($vcpkgJson.dependencies) {
            $vcpkgJson.dependencies = $vcpkgJson.dependencies | Where-Object { 
              $_ -ne "opus" -and $_.name -ne "opus" 
            }
          }
          
          # 保存修改
          $vcpkgJson | ConvertTo-Json -Depth 10 | Set-Content "vcpkg.json" -Encoding UTF8
          
          Write-Host "=== Modified vcpkg.json ==="
          Get-Content "vcpkg.json"
        }
        
    - name: Remove magnum-opus from Cargo.toml
      run: |
        # 修改 Cargo.toml
        $cargoToml = Get-Content "Cargo.toml" -Raw
        $cargoToml = $cargoToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
        $cargoToml | Set-Content "Cargo.toml" -Encoding UTF8
        
        # 修改 libs/hbb_common/Cargo.toml
        if (Test-Path "libs/hbb_common/Cargo.toml") {
          $hbbToml = Get-Content "libs/hbb_common/Cargo.toml" -Raw
          $hbbToml = $hbbToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
          $hbbToml | Set-Content "libs/hbb_common/Cargo.toml" -Encoding UTF8
        }
        
    - name: Install VCPKG dependencies
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        C:\vcpkg\vcpkg install --triplet x64-windows-static
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Build RustDesk
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
