name: Build RustDesk Remove Opus Dependency

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
        
    - name: Install NASM
      run: |
        choco install nasm -y
        
    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        
    - name: Install dependencies (without opus)
      run: |
        C:\vcpkg\vcpkg install libvpx:x64-windows-static
        C:\vcpkg\vcpkg install libyuv:x64-windows-static
        C:\vcpkg\vcpkg install aom:x64-windows-static
        
    - name: Remove magnum-opus dependency
      run: |
        # 修改 Cargo.toml，注释掉 magnum-opus 依赖
        $cargoToml = Get-Content "Cargo.toml" -Raw
        $cargoToml = $cargoToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
        $cargoToml | Set-Content "Cargo.toml" -Encoding UTF8
        
        # 修改 libs/hbb_common/Cargo.toml
        if (Test-Path "libs/hbb_common/Cargo.toml") {
          $hbbToml = Get-Content "libs/hbb_common/Cargo.toml" -Raw
          $hbbToml = $hbbToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
          $hbbToml | Set-Content "libs/hbb_common/Cargo.toml" -Encoding UTF8
        }
        
        # 显示修改后的内容
        Write-Host "=== Modified Cargo.toml ==="
        Get-Content "Cargo.toml" | Select-String -Pattern "opus" -Context 2,2
        
    - name: Build RustDesk
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
