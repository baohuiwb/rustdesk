name: Build RustDesk Fix Include Paths

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Install LLVM
      run: |
        choco install llvm -y
      continue-on-error: true
        
    - name: Setup VCPKG
      run: |
        git clone https://github.com/microsoft/vcpkg C:\vcpkg
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat
        
    - name: Modify vcpkg.json - remove problematic dependencies
      run: |
        if (Test-Path "vcpkg.json") {
          $vcpkgJson = Get-Content "vcpkg.json" -Raw | ConvertFrom-Json
          
          # 移除 opus 和 aom
          if ($vcpkgJson.dependencies) {
            $vcpkgJson.dependencies = $vcpkgJson.dependencies | Where-Object { 
              $_ -ne "opus" -and 
              $_ -ne "aom" -and 
              $_.name -ne "opus" -and 
              $_.name -ne "aom"
            }
          }
          
          $vcpkgJson | ConvertTo-Json -Depth 10 | Set-Content "vcpkg.json" -Encoding UTF8
        }
        
    - name: Remove magnum-opus from all Cargo.toml files
      run: |
        # 修改主 Cargo.toml
        $cargoToml = Get-Content "Cargo.toml" -Raw
        $cargoToml = $cargoToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
        $cargoToml = $cargoToml -replace '"magnum-opus/[^"]*",?\s*', ''
        $cargoToml = $cargoToml -replace ',\s*\]', ']'
        $cargoToml | Set-Content "Cargo.toml" -Encoding UTF8
        
        # 修改 libs/hbb_common/Cargo.toml
        if (Test-Path "libs/hbb_common/Cargo.toml") {
          $hbbToml = Get-Content "libs/hbb_common/Cargo.toml" -Raw
          $hbbToml = $hbbToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
          $hbbToml = $hbbToml -replace '"magnum-opus/[^"]*",?\s*', ''
          $hbbToml = $hbbToml -replace ',\s*\]', ']'
          $hbbToml | Set-Content "libs/hbb_common/Cargo.toml" -Encoding UTF8
        }
        
        # 修改 libs/scrap/Cargo.toml
        if (Test-Path "libs/scrap/Cargo.toml") {
          $scrapToml = Get-Content "libs/scrap/Cargo.toml" -Raw
          $scrapToml = $scrapToml -replace '(?m)^magnum-opus\s*=.*$', '# magnum-opus = removed'
          $scrapToml = $scrapToml -replace '"magnum-opus/[^"]*",?\s*', ''
          $scrapToml = $scrapToml -replace ',\s*\]', ']'
          $scrapToml | Set-Content "libs/scrap/Cargo.toml" -Encoding UTF8
        }
        
    - name: Install VCPKG dependencies
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        C:\vcpkg\vcpkg install --triplet x64-windows-static
      env:
        VCPKG_ROOT: C:\vcpkg
        
    - name: Fix VPX header file paths
      run: |
        # 修改 scrap 的 build.rs 或创建符号链接
        $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
        
        # 检查 vpx 头文件是否存在
        if (Test-Path "$vcpkgInclude\vpx") {
          Write-Host "✓ VPX headers found at: $vcpkgInclude\vpx"
          Get-ChildItem "$vcpkgInclude\vpx" | Select-Object -First 5
        } else {
          Write-Host "✗ VPX headers not found!"
        }
        
    - name: Build RustDesk
      run: |
        $env:VCPKG_ROOT = "C:\vcpkg"
        $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
        
        # 设置包含路径环境变量
        $vcpkgInclude = "C:\vcpkg\installed\x64-windows-static\include"
        $env:CPLUS_INCLUDE_PATH = "$vcpkgInclude;$env:CPLUS_INCLUDE_PATH"
        $env:C_INCLUDE_PATH = "$vcpkgInclude;$env:C_INCLUDE_PATH"
        $env:BINDGEN_EXTRA_CLANG_ARGS = "-I$vcpkgInclude"
        
        Write-Host "=== Build Environment ==="
        Write-Host "VCPKG_ROOT: $env:VCPKG_ROOT"
        Write-Host "LIBCLANG_PATH: $env:LIBCLANG_PATH"
        Write-Host "BINDGEN_EXTRA_CLANG_ARGS: $env:BINDGEN_EXTRA_CLANG_ARGS"
        
        # 开始编译
        cargo build --release --target x86_64-pc-windows-msvc
      env:
        VCPKG_ROOT: C:\vcpkg
        LIBCLANG_PATH: C:\Program Files\LLVM\bin
        
    - name: Check build output
      run: |
        if (Test-Path "target/x86_64-pc-windows-msvc/release/rustdesk.exe") {
          $size = (Get-Item "target/x86_64-pc-windows-msvc/release/rustdesk.exe").Length
          Write-Host "✓ Build successful! rustdesk.exe size: $size bytes"
        } else {
          Write-Host "✗ Build failed - rustdesk.exe not found"
          exit 1
        }
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rustdesk-custom-windows
        path: target/x86_64-pc-windows-msvc/release/rustdesk.exe
        retention-days: 7
